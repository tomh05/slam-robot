slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan

    transform_timeout: 0.3
    tf_buffer_duration: 20.0
    map_update_interval: 2.0

    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.25
    minimum_travel_distance: 0.03
    minimum_travel_heading: 0.03

    throttle_scans: 1
    scan_queue_size: 5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 8.0

    use_scan_matching: true
    use_scan_barycenter: false
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 6
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
