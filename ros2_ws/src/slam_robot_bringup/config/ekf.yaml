# robot_localization EKF for slam-robot (ROS 2 Jazzy).
#
# Fuses wheel odometry from arduino_base_node (/odom) with BM160 IMU (/imu/data)
# into /odometry/filtered. Intended as the local odometry source for slam_toolbox/Nav2.
#
# IMPORTANT - TF ownership:
#   arduino_base_node currently publishes odom -> base_link
#   (ros2_ws/src/slam_robot_base/config/arduino_base.yaml: publish_tf: true).
#   When using this EKF, run only ONE odom -> base_link publisher:
#     - set arduino_base_node publish_tf: false, and keep this node's publish_tf: true.
#
# Topics/frames expected:
#   odom0: /odom            (nav_msgs/Odometry, frame_id=odom, child_frame_id=base_link)
#   imu0:  /imu/data        (sensor_msgs/Imu, frame_id=imu_link)
#   TF:    base_link -> imu_link from robot_state_publisher (slam_robot_description URDF)
#
# Conservative tracked-robot fusion: wheel linear/angular velocity + IMU yaw rate.
# Enable linear acceleration only after verifying IMU mount/alignment, gravity
# handling, units, and covariances; bad accel fusion can degrade position badly.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry (arduino_base_node). Fuse twist velocities; pose is integrated by EKF.
    # Config order: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # BM160 IMU (bm160_imu_node). Raw driver publishes no orientation; fuse yaw rate.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    # Set true if imu0 linear acceleration is fused and /imu/data includes gravity.
    # bm160_imu_node publishes raw acceleration including gravity.
    imu0_remove_gravitational_acceleration: true

    # Initial process noise / covariances can be tuned after bringup. The filter
    # also uses covariances from incoming sensor messages; arduino_base_node and
    # bm160_imu_node currently publish conservative placeholder/default covariances.
