arduino_base_node:
  ros__parameters:
    port: /dev/arduino
    baud: 115200

    odom_frame_id: odom
    base_frame_id: base_link

    # Initial measured mechanical values from hardware inventory.
    # track_width_m is the centre-to-centre distance between left/right track contact patches.
    track_width_m: 0.155
    wheel_radius_m: 0.029

    # Encoder characterisation from bench calibration (S1 edges/2, manual wheel revs).
    # Legacy shared values remain as fallback; side-specific values below take precedence.
    #
    # Direction is now inferred from the motor's commanded direction in the
    # Arduino firmware (single-channel tachometer workaround for right encoder
    # hardware fault). The firmware reports signed positions (positive for
    # forward, negative for backward) based on the V command sign.
    #
    # Calibration:
    # 1. Set LEFT_MOTOR_SIGN / RIGHT_MOTOR_SIGN in the firmware so that
    #    positive PWM = physical forward for each motor.
    # 2. With both motors_enabled and command_sign = 1.0, command forward motion
    #    (positive linear.x) and verify that BOTH left_position and right_position
    #    increase in the E status lines.
    # 3. If a wheel's position moves the wrong way, set its *_encoder_sign to -1.0
    #    as a fine-calibration flip. Do NOT use *_encoder_sign as a primary
    #    direction fix — fix motor wiring/sign in the firmware first.
    # Distance scale adjusted from straight-line tests (odom vs real).
    ticks_per_rev: 360.0
    ticks_per_meter: 0.0
    left_ticks_per_rev: 250.1
    right_ticks_per_rev: 246.3
    left_ticks_per_meter: 0.0
    right_ticks_per_meter: 0.0

    left_encoder_sign: 1.0
    right_encoder_sign: 1.0
    left_command_sign: 1.0
    right_command_sign: 1.0

    max_linear_mps: 0.20
    max_angular_rps: 1.0
    max_target_tps: 250.0
    cmd_vel_timeout_s: 0.5
    command_rate_hz: 20.0
    serial_read_rate_hz: 100.0
    publish_tf: true

    # Safety default: do not move motors until explicitly enabled.
    motors_enabled: false
    send_zero_when_disabled: true

    # Odometry covariance placeholders (m^2 and (rad/s)^2).
    # These tell robot_localization how much to trust raw wheel odom vs the
    # EKF/SLAM. For a tracked base yaw is the weakest channel (track slip), so
    # pose yaw covariance should be much larger than x/y. Tune with
    # scripts/calibrate_odom_cov.py after encoder scale is calibrated.
    odom_pose_x_cov: 0.05
    odom_pose_y_cov: 0.05
    odom_pose_yaw_cov: 0.20
    odom_twist_vx_cov: 0.10
    odom_twist_vyaw_cov: 0.30

    # Battery/supply sensing via Arduino A0 (2:1 divider, 12k/12k).
    # Polled with the 'B' serial command and published as sensor_msgs/BatteryState.
    battery_poll_period_s: 5.0
    battery_frame_id: base_link
    battery_location: base
    # Calibrated from measured pack-vs-ROS pairs:
    #   8.25/8.826 and 8.12/8.69 => average scale ~= 0.9346
    battery_voltage_scale: 0.9346
    battery_source_dc_min_v: 8.7
    battery_voltage_min_v: 6.0
    battery_voltage_max_v: 9.5
    # Approximate 2S Li-ion percentage bounds (set empty_voltage >= full_voltage to disable).
    battery_full_voltage: 8.4
    battery_empty_voltage: 6.6
